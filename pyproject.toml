[project]
name = "pdf-parser-mcp"
version = "0.1.0"
description = "PDF 图文混排解析 MCP Server (MinerU + VLM hybrid pipeline)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lou", email = "609902379@qq.com"},
]
keywords = ["pdf", "mcp", "parser", "ocr", "rag", "mineru", "vlm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "pdfplumber",
    "httpx",
    "python-multipart",
    "pydantic",
    "python-dotenv",
    "camelot-py[cv]>=2.0.0",
    "reportlab>=5.0.0",
    "oss2>=2.19.1",
    "mcp<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/lousicong18/pdf-parsing"
Repository = "https://github.com/lousicong18/pdf-parsing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
pdf-parser-demo = "src.server:main"
pdf-parser-mcp = "src.mcp_server:main"
